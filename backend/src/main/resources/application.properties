# ==========================================================================
# 🔬 QUIMI-K • Spring Boot 3.x Configuración de Producción (Sección 14)
# ==========================================================================
server.port=8080
spring.application.name=quimik-simulab-backend

# Base de datos PostgreSQL 15+ (Sección 14)
spring.datasource.url=jdbc:postgresql://localhost:5432/quimik_db
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

# Spring Data JPA & Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Spring Security & JWT Stateless
quimik.security.jwt.secret=QuimiK_VirtualLab_SecretKey_2026_FlemingEdu_Stateless_JWT_32Bytes!
quimik.security.jwt.expiration-ms=86400000

# Quimioinformática & PubChem Gateway
pubchem.api.base-url=https://pubchem.ncbi.nlm.nih.gov/rest/pug
